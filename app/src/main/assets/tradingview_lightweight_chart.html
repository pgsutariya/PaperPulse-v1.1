<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none';" />
  <title>PaperPulse TradingView Chart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #131722;
      color: #D1D4DC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #chart {
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 68px;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: rgba(19, 23, 34, 0.72);
      padding: 3px 6px;
      border-radius: 6px;
      width: fit-content;
      max-width: calc(100% - 76px);
    }
    #hud-title {
      font-size: 11px;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #hud-ohlc {
      font-size: 10.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #26A69A;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #hud-pane {
      font-size: 10px;
      color: #94A3B8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #tv-badge {
      position: absolute;
      bottom: 30px;
      left: 8px;
      z-index: 15;
      pointer-events: none;
      font-size: 9.5px;
      font-weight: 600;
      color: rgba(209, 212, 220, 0.45);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="hud">
      <div id="hud-title">TradingView Lightweight Charts</div>
      <div id="hud-ohlc">Loading chart…</div>
      <div id="hud-pane"></div>
    </div>
    <div id="chart"></div>
    <div id="tv-badge">TradingView Lightweight Charts</div>
  </div>

  <script>
    (function () {
      const CDN_URLS = [
        "https://unpkg.com/lightweight-charts@5/dist/lightweight-charts.standalone.production.js",
        "https://cdn.jsdelivr.net/npm/lightweight-charts@5/dist/lightweight-charts.standalone.production.js",
        "https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"
      ];

      let chart = null;
      let mainSeries = null;
      let markersController = null;
      let overlaySeriesList = [];
      let lowerHistogramSeries = null;
      let lowerLineSeriesList = [];
      let priceLineHandles = [];
      let lowerPriceLineHandles = [];
      let lastPayload = null;
      let lastContextKey = "";
      let lastStyleKey = "";
      let lastLowerPaneKey = "";
      let lastOverlaySpecKey = "";
      let lastLowerSpecKey = "";
      let paneRatioInitialized = false;
      let lastContainerW = 0;
      let lastContainerH = 0;
      let libraryLoaded = false;

      const hudTitle = document.getElementById("hud-title");
      const hudOhlc = document.getElementById("hud-ohlc");
      const hudPane = document.getElementById("hud-pane");
      const container = document.getElementById("chart");

      function notifyReady(versionStr) {
        if (window.PaperPulseChartBridge && typeof window.PaperPulseChartBridge.onChartReady === "function") {
          window.PaperPulseChartBridge.onChartReady(String(versionStr || "loaded"));
        }
      }

      function notifyError(msg) {
        hudOhlc.textContent = msg;
        hudOhlc.style.color = "#EF5350";
        if (window.PaperPulseChartBridge && typeof window.PaperPulseChartBridge.onChartError === "function") {
          window.PaperPulseChartBridge.onChartError(String(msg));
        }
      }

      function formatPrice(v) {
        if (typeof v !== "number" || !isFinite(v)) return "--";
        const av = Math.abs(v);
        if (av >= 1000) return v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        if (av >= 1) return v.toFixed(2);
        return v.toFixed(4);
      }

      function formatVol(v) {
        if (typeof v !== "number" || !isFinite(v)) return "--";
        const av = Math.abs(v);
        if (av >= 1e6) return (v / 1e6).toFixed(2) + "M";
        if (av >= 1e3) return (v / 1e3).toFixed(1) + "K";
        return Math.round(v).toString();
      }

      function formatIstTime(epochSec, isIntraday) {
        if (typeof epochSec !== "number" || !isFinite(epochSec)) return "";
        try {
          const d = new Date(epochSec * 1000);
          if (isIntraday) {
            return new Intl.DateTimeFormat("en-IN", {
              timeZone: "Asia/Kolkata",
              day: "2-digit",
              month: "short",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false
            }).format(d);
          }
          return new Intl.DateTimeFormat("en-IN", {
            timeZone: "Asia/Kolkata",
            day: "2-digit",
            month: "short",
            year: "2-digit"
          }).format(d);
        } catch (e) {
          return "";
        }
      }

      function isV5() {
        return !!(window.LightweightCharts && typeof window.LightweightCharts.CandlestickSeries !== "undefined");
      }

      function addTypedSeries(typeName, options, paneIndex) {
        if (!chart) return null;
        if (isV5() && typeof chart.addSeries === "function") {
          const seriesDef = window.LightweightCharts[typeName];
          if (typeof paneIndex === "number" && paneIndex > 0) {
            return chart.addSeries(seriesDef, options, paneIndex);
          }
          return chart.addSeries(seriesDef, options);
        }
        // Fallback for v4.x
        if (typeName === "CandlestickSeries") return chart.addCandlestickSeries(options);
        if (typeName === "AreaSeries") return chart.addAreaSeries(options);
        if (typeName === "LineSeries") return chart.addLineSeries(options);
        if (typeName === "HistogramSeries") return chart.addHistogramSeries(options);
        return null;
      }

      function applySeriesMarkers(series, markers) {
        if (!series) return;
        const safeMarkers = Array.isArray(markers) ? markers : [];
        if (isV5() && typeof window.LightweightCharts.createSeriesMarkers === "function") {
          if (markersController) {
            markersController.setMarkers(safeMarkers);
          } else {
            markersController = window.LightweightCharts.createSeriesMarkers(series, safeMarkers);
          }
        } else if (typeof series.setMarkers === "function") {
          series.setMarkers(safeMarkers);
        }
      }

      function updateHudCandle(candle, payload) {
        if (!candle || !payload) return;
        const bull = candle.close >= candle.open;
        const pct = candle.open > 0 ? ((candle.close - candle.open) / candle.open) * 100 : 0;
        const sign = pct >= 0 ? "+" : "";
        hudTitle.textContent = payload.symbol + " • " + payload.timeframeLabel + " • " + payload.chartStyle.replace("_", " ").toUpperCase();
        hudOhlc.textContent =
          "O " + formatPrice(candle.open) +
          "  H " + formatPrice(candle.high) +
          "  L " + formatPrice(candle.low) +
          "  C " + formatPrice(candle.close) +
          " (" + sign + pct.toFixed(2) + "%)" +
          "  V " + formatVol(candle.volume);
        hudOhlc.style.color = bull ? "#26A69A" : "#EF5350";
        if (payload.lowerPane && payload.lowerPane.title) {
          hudPane.textContent = "Pane: " + payload.lowerPane.title;
        }
      }

      function lockPaneProportions(forceSetHeightFallback) {
        if (!chart || !isV5() || typeof chart.panes !== "function") return;
        try {
          const panes = chart.panes();
          if (!panes || panes.length < 2) return;
          // Prefer idempotent stretch factors (76% main spot window / 24% volume-indicator pane)
          if (typeof panes[0].setStretchFactor === "function" && typeof panes[1].setStretchFactor === "function") {
            panes[0].setStretchFactor(3.15);
            panes[1].setStretchFactor(1.0);
            paneRatioInitialized = true;
          } else if ((forceSetHeightFallback || !paneRatioInitialized) && typeof panes[1].setHeight === "function") {
            const totalH = container.clientHeight || window.innerHeight || 480;
            const lowerH = Math.min(116, Math.max(76, Math.round(totalH * 0.23)));
            panes[1].setHeight(lowerH);
            paneRatioInitialized = true;
          }
        } catch (e) {}
      }

      function destroyChart() {
        if (chart) {
          try { chart.remove(); } catch (e) {}
        }
        chart = null;
        mainSeries = null;
        markersController = null;
        overlaySeriesList = [];
        lowerHistogramSeries = null;
        lowerLineSeriesList = [];
        priceLineHandles = [];
        lowerPriceLineHandles = [];
        lastOverlaySpecKey = "";
        lastLowerSpecKey = "";
        paneRatioInitialized = false;
      }

      function createChartInstance(payload) {
        destroyChart();
        const LWC = window.LightweightCharts;
        const crosshairMode = payload.magnetCrosshair
          ? (LWC.CrosshairMode ? LWC.CrosshairMode.Magnet : 1)
          : (LWC.CrosshairMode ? LWC.CrosshairMode.Normal : 0);

        const priceScaleMode = payload.logScale
          ? (LWC.PriceScaleMode ? LWC.PriceScaleMode.Logarithmic : 1)
          : (LWC.PriceScaleMode ? LWC.PriceScaleMode.Normal : 0);

        const w = Math.max(200, container.clientWidth || window.innerWidth || 360);
        const h = Math.max(240, container.clientHeight || window.innerHeight || 480);
        lastContainerW = w;
        lastContainerH = h;

        chart = LWC.createChart(container, {
          width: w,
          height: h,
          layout: {
            background: { type: LWC.ColorType ? LWC.ColorType.Solid : "solid", color: "#131722" },
            textColor: "#D1D4DC",
            fontSize: 11,
            panes: {
              separatorColor: "#2A2E39",
              separatorHoverColor: "#2962FF",
              enableResize: false
            }
          },
          grid: {
            vertLines: { color: "rgba(42, 46, 57, 0.45)" },
            horzLines: { color: "rgba(42, 46, 57, 0.45)" }
          },
          crosshair: {
            mode: crosshairMode,
            vertLine: {
              color: "#787B86",
              width: 1,
              style: LWC.LineStyle ? LWC.LineStyle.Dashed : 2,
              labelBackgroundColor: "#2A2E39"
            },
            horzLine: {
              color: "#787B86",
              width: 1,
              style: LWC.LineStyle ? LWC.LineStyle.Dashed : 2,
              labelBackgroundColor: "#2A2E39"
            }
          },
          rightPriceScale: {
            borderColor: "#2A2E39",
            mode: priceScaleMode,
            scaleMargins: { top: 0.12, bottom: 0.06 }
          },
          timeScale: {
            borderColor: "#2A2E39",
            timeVisible: !!payload.isIntraday,
            secondsVisible: false,
            rightOffset: 4,
            barSpacing: 7,
            tickMarkFormatter: function (time) {
              return formatIstTime(time, !!payload.isIntraday);
            }
          },
          localization: {
            timeFormatter: function (time) {
              return formatIstTime(time, !!payload.isIntraday);
            }
          },
          handleScroll: {
            mouseWheel: true,
            pressedMouseMove: true,
            horzTouchDrag: true,
            vertTouchDrag: false
          },
          handleScale: {
            axisPressedMouseMove: true,
            mouseWheel: true,
            pinch: true
          }
        });

        chart.subscribeCrosshairMove(function (param) {
          if (!lastPayload || !lastPayload.candles || lastPayload.candles.length === 0) return;
          if (!param || !param.time) {
            updateHudCandle(lastPayload.candles[lastPayload.candles.length - 1], lastPayload);
            return;
          }
          const matched = lastPayload.candles.find(function (c) { return c.time === param.time; });
          if (matched) {
            updateHudCandle(matched, lastPayload);
          }
        });
      }

      function clearPriceLines() {
        priceLineHandles.forEach(function (h) {
          try { if (mainSeries) mainSeries.removePriceLine(h); } catch (e) {}
        });
        priceLineHandles = [];
      }

      function clearOverlaySeries() {
        overlaySeriesList.forEach(function (s) {
          try { chart.removeSeries(s); } catch (e) {}
        });
        overlaySeriesList = [];
        lastOverlaySpecKey = "";
      }

      function clearLowerPriceLines() {
        lowerPriceLineHandles.forEach(function (item) {
          try { item.series.removePriceLine(item.line); } catch (e) {}
        });
        lowerPriceLineHandles = [];
      }

      function clearLowerSeries() {
        clearLowerPriceLines();
        if (lowerHistogramSeries) {
          try { chart.removeSeries(lowerHistogramSeries); } catch (e) {}
          lowerHistogramSeries = null;
        }
        lowerLineSeriesList.forEach(function (s) {
          try { chart.removeSeries(s); } catch (e) {}
        });
        lowerLineSeriesList = [];
        lastLowerSpecKey = "";
      }

      function computeOverlaySpecKey(overlayLines) {
        if (!Array.isArray(overlayLines) || overlayLines.length === 0) return "";
        return overlayLines.map(function (ol) {
          return (ol.color || "") + ":" + (ol.lineWidth || 2) + ":" + (ol.dashed ? "1" : "0");
        }).join("|");
      }

      function computeLowerSpecKey(lp) {
        if (!lp) return "NONE";
        const hasHist = Array.isArray(lp.histogram) && lp.histogram.length > 0 ? "H1" : "H0";
        const linesKey = (lp.lines || []).map(function (ll) {
          return (ll.color || "") + ":" + (ll.lineWidth || 2) + ":" + (ll.dashed ? "1" : "0");
        }).join(",");
        return (lp.paneKey || "VOLUME") + "|" + hasHist + "|" + linesKey;
      }

      function renderPayload(payload) {
        if (!libraryLoaded || !window.LightweightCharts) {
          lastPayload = payload;
          return;
        }
        if (!payload || !Array.isArray(payload.candles) || payload.candles.length === 0) {
          hudOhlc.textContent = "Waiting for candles…";
          return;
        }

        const contextKey = payload.symbol + "|" + payload.timeframeLabel;
        const styleKey = payload.chartStyle;
        const paneKey = (payload.lowerPane && payload.lowerPane.paneKey) || "VOLUME";
        const needsFullRebuild = !chart || contextKey !== lastContextKey || styleKey !== lastStyleKey || paneKey !== lastLowerPaneKey;

        let savedRange = null;
        if (!needsFullRebuild && chart) {
          try { savedRange = chart.timeScale().getVisibleLogicalRange(); } catch (e) {}
        }

        const LWC = window.LightweightCharts;
        if (needsFullRebuild) {
          createChartInstance(payload);
          if (styleKey === "area") {
            mainSeries = addTypedSeries("AreaSeries", {
              lineColor: "#2962FF",
              topColor: "rgba(41, 98, 255, 0.35)",
              bottomColor: "rgba(41, 98, 255, 0.02)",
              lineWidth: 2
            }, 0);
          } else if (styleKey === "hollow") {
            mainSeries = addTypedSeries("CandlestickSeries", {
              upColor: "transparent",
              downColor: "#EF5350",
              borderUpColor: "#26A69A",
              borderDownColor: "#EF5350",
              wickUpColor: "#26A69A",
              wickDownColor: "#EF5350",
              borderVisible: true
            }, 0);
          } else {
            mainSeries = addTypedSeries("CandlestickSeries", {
              upColor: "#26A69A",
              downColor: "#EF5350",
              borderUpColor: "#26A69A",
              borderDownColor: "#EF5350",
              wickUpColor: "#26A69A",
              wickDownColor: "#EF5350",
              borderVisible: false
            }, 0);
          }
          // Keep main price scale cleanly framed in Pane 0
          try {
            if (mainSeries && typeof mainSeries.priceScale === "function") {
              mainSeries.priceScale().applyOptions({
                scaleMargins: isV5() ? { top: 0.12, bottom: 0.06 } : { top: 0.10, bottom: 0.28 }
              });
            }
          } catch (e) {}
        } else {
          // Update scale/crosshair options smoothly without touching panes or recreating series
          chart.applyOptions({
            crosshair: {
              mode: payload.magnetCrosshair
                ? (LWC.CrosshairMode ? LWC.CrosshairMode.Magnet : 1)
                : (LWC.CrosshairMode ? LWC.CrosshairMode.Normal : 0)
            },
            rightPriceScale: {
              mode: payload.logScale
                ? (LWC.PriceScaleMode ? LWC.PriceScaleMode.Logarithmic : 1)
                : (LWC.PriceScaleMode ? LWC.PriceScaleMode.Normal : 0)
            }
          });
        }

        // Main series data
        if (styleKey === "area") {
          mainSeries.setData(payload.candles.map(function (c) {
            return { time: c.time, value: c.close };
          }));
        } else {
          mainSeries.setData(payload.candles.map(function (c) {
            return { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close };
          }));
        }

        // Markers (BOS/CHoCH, Divergences, EMA Cross, Renko, Red Bar)
        applySeriesMarkers(mainSeries, payload.markers || []);

        // Price Lines (Pivots, SMC POIs, Liquidity, Setup Levels)
        const dashedStyle = LWC.LineStyle ? LWC.LineStyle.Dashed : 2;
        const solidStyle = LWC.LineStyle ? LWC.LineStyle.Solid : 0;
        clearPriceLines();
        (payload.priceLines || []).forEach(function (pl) {
          const handle = mainSeries.createPriceLine({
            price: pl.price,
            color: pl.color,
            lineWidth: pl.lineWidth || 1,
            lineStyle: pl.dashed ? dashedStyle : solidStyle,
            axisLabelVisible: true,
            title: pl.title || ""
          });
          priceLineHandles.push(handle);
        });

        // Overlay indicator line series (update in-place when structure is unchanged!)
        const overlayLines = payload.overlayLines || [];
        const overlaySpecKey = computeOverlaySpecKey(overlayLines);
        if (needsFullRebuild || overlaySpecKey !== lastOverlaySpecKey || overlaySeriesList.length !== overlayLines.length) {
          clearOverlaySeries();
          overlayLines.forEach(function (ol) {
            const line = addTypedSeries("LineSeries", {
              color: ol.color,
              lineWidth: ol.lineWidth || 2,
              lineStyle: ol.dashed ? dashedStyle : solidStyle,
              priceLineVisible: false,
              lastValueVisible: false,
              crosshairMarkerVisible: false
            }, 0);
            if (line) {
              line.setData(ol.data.map(function (pt) {
                return { time: pt.time, value: pt.value };
              }));
              overlaySeriesList.push(line);
            }
          });
          lastOverlaySpecKey = overlaySpecKey;
        } else {
          overlayLines.forEach(function (ol, idx) {
            const existing = overlaySeriesList[idx];
            if (existing) {
              existing.setData(ol.data.map(function (pt) {
                return { time: pt.time, value: pt.value };
              }));
            }
          });
        }

        // Lower Pane (Volume / RSI / MACD / CVD / ATR) — update in-place on live ticks so Pane 1 NEVER drifts!
        const lp = payload.lowerPane;
        const lowerSpecKey = computeLowerSpecKey(lp);
        if (lp) {
          const useV5Pane = isV5();
          const targetPane = useV5Pane ? 1 : 0;
          const v4ScaleOpts = useV5Pane ? {} : {
            priceScaleId: "lower_pane_v4",
            scaleMargins: { top: 0.78, bottom: 0.0 }
          };
          const hasHist = Array.isArray(lp.histogram) && lp.histogram.length > 0;
          const lpLines = lp.lines || [];
          const needRebuildLower = needsFullRebuild || lowerSpecKey !== lastLowerSpecKey;

          if (needRebuildLower) {
            clearLowerSeries();
            if (hasHist) {
              lowerHistogramSeries = addTypedSeries("HistogramSeries", Object.assign({
                priceFormat: { type: "volume" },
                priceLineVisible: false,
                lastValueVisible: false
              }, v4ScaleOpts), targetPane);
              try {
                if (useV5Pane && lowerHistogramSeries && typeof lowerHistogramSeries.priceScale === "function") {
                  lowerHistogramSeries.priceScale().applyOptions({
                    scaleMargins: { top: 0.18, bottom: 0.0 }
                  });
                }
              } catch (e) {}
            }
            lpLines.forEach(function (ll) {
              const line = addTypedSeries("LineSeries", Object.assign({
                color: ll.color,
                lineWidth: ll.lineWidth || 2,
                lineStyle: ll.dashed ? dashedStyle : solidStyle,
                priceLineVisible: false,
                lastValueVisible: true
              }, v4ScaleOpts), targetPane);
              if (line) {
                try {
                  if (useV5Pane && typeof line.priceScale === "function") {
                    line.priceScale().applyOptions({
                      scaleMargins: { top: 0.12, bottom: 0.08 }
                    });
                  }
                } catch (e) {}
                lowerLineSeriesList.push(line);
              }
            });
            lastLowerSpecKey = lowerSpecKey;
            if (!useV5Pane) {
              try {
                chart.priceScale("lower_pane_v4").applyOptions({
                  scaleMargins: { top: 0.78, bottom: 0.0 }
                });
              } catch (e) {}
            }
            lockPaneProportions(true);
          }

          // Always refresh data in-place (zero pane recreation / zero height drift)
          if (lowerHistogramSeries && hasHist) {
            lowerHistogramSeries.setData(lp.histogram.map(function (pt) {
              return pt.color ? { time: pt.time, value: pt.value, color: pt.color } : { time: pt.time, value: pt.value };
            }));
          }
          lpLines.forEach(function (ll, idx) {
            const line = lowerLineSeriesList[idx];
            if (line) {
              line.setData(ll.data.map(function (pt) {
                return { time: pt.time, value: pt.value };
              }));
            }
          });

          const anchorLowerSeries = lowerHistogramSeries || lowerLineSeriesList[0] || null;
          clearLowerPriceLines();
          if (anchorLowerSeries && Array.isArray(lp.priceLines)) {
            lp.priceLines.forEach(function (pl) {
              const handle = anchorLowerSeries.createPriceLine({
                price: pl.price,
                color: pl.color,
                lineWidth: pl.lineWidth || 1,
                lineStyle: pl.dashed ? dashedStyle : solidStyle,
                axisLabelVisible: true,
                title: pl.title || ""
              });
              lowerPriceLineHandles.push({ series: anchorLowerSeries, line: handle });
            });
          }
        } else {
          clearLowerSeries();
        }

        if (needsFullRebuild || !savedRange) {
          const total = payload.candles.length;
          const initialBars = Math.min(total, 95);
          if (total > initialBars) {
            chart.timeScale().setVisibleLogicalRange({
              from: total - initialBars,
              to: total + 4
            });
          } else {
            chart.timeScale().fitContent();
          }
        } else {
          try { chart.timeScale().setVisibleLogicalRange(savedRange); } catch (e) {}
        }

        lastPayload = payload;
        lastContextKey = contextKey;
        lastStyleKey = styleKey;
        lastLowerPaneKey = paneKey;
        updateHudCandle(payload.candles[payload.candles.length - 1], payload);
      }

      window.renderPaperPulseChartBase64 = function (b64) {
        try {
          const binary = atob(b64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          const jsonStr = new TextDecoder("utf-8").decode(bytes);
          const payload = JSON.parse(jsonStr);
          renderPayload(payload);
        } catch (err) {
          notifyError("Chart data parse error: " + (err && err.message ? err.message : String(err)));
        }
      };

      window.tvZoom = function (direction) {
        if (!chart) return;
        try {
          const ts = chart.timeScale();
          const range = ts.getVisibleLogicalRange();
          if (!range) return;
          const span = range.to - range.from;
          if (span <= 0) return;
          const factor = direction > 0 ? 0.78 : 1.28;
          const nextSpan = Math.max(12, Math.min(600, span * factor));
          const rightAnchor = range.to;
          ts.setVisibleLogicalRange({ from: rightAnchor - nextSpan, to: rightAnchor });
        } catch (e) {}
      };

      window.tvResetView = function () {
        if (!chart) return;
        try {
          chart.timeScale().fitContent();
          chart.priceScale("right").applyOptions({ autoScale: true });
          lockPaneProportions(true);
        } catch (e) {}
      };

      const resizeObserver = new ResizeObserver(function () {
        if (!chart) return;
        const w = container.clientWidth;
        const h = container.clientHeight;
        if (w > 0 && h > 0 && (Math.abs(w - lastContainerW) >= 2 || Math.abs(h - lastContainerH) >= 2)) {
          lastContainerW = w;
          lastContainerH = h;
          if (typeof chart.resize === "function") {
            chart.resize(w, h);
          } else {
            chart.applyOptions({ width: w, height: h });
          }
          lockPaneProportions(false);
        }
      });
      resizeObserver.observe(container);

      function loadScriptAt(index) {
        if (index >= CDN_URLS.length) {
          notifyError("Unable to load TradingView Lightweight Charts (check internet connection).");
          return;
        }
        const script = document.createElement("script");
        script.src = CDN_URLS[index];
        script.async = true;
        script.onload = function () {
          if (window.LightweightCharts && typeof window.LightweightCharts.createChart === "function") {
            libraryLoaded = true;
            const ver = typeof window.LightweightCharts.version === "function"
              ? window.LightweightCharts.version()
              : (isV5() ? "5.x" : "4.x");
            notifyReady(ver);
            if (lastPayload) {
              renderPayload(lastPayload);
            }
          } else {
            loadScriptAt(index + 1);
          }
        };
        script.onerror = function () {
          loadScriptAt(index + 1);
        };
        document.head.appendChild(script);
      }

      loadScriptAt(0);
    })();
  </script>
</body>
</html>
